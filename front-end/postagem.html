<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Postagem - Cenário Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="./assets/img/logoChrome.png" type="image/png">
    <link rel="stylesheet" href="./assets/css/postagem.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-fixed shadow-sm">
        <div class="container">
            <img src="./assets/img/logo.png" class="navbar-img">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/criar-post">Criar Post</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sobre">Sobre</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="glass-card">
                    <form id="createForm">
                        <div class="text-center mb-4">
                            <i class="bi bi-plus-circle-dotted display-4 text-white mb-2 d-block"></i>
                            <h2 class="fw-bold text-white">Criar Nova Postagem</h2>
                            <p class="text-white-50">Compartilhe seu conhecimento com o mundo.</p>
                        </div>
                        
                        <div class="mb-4">
                            <label for="titulo" class="form-label"><i class="bi bi-type-h1 me-2"></i>Título</label>
                            <input type="text" name="titulo" class="form-control" placeholder="Ex: O Futuro da IA" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="autor" class="form-label"><i class="bi bi-person-badge me-2"></i>Autor</label>
                            <input type="text" name="autor" class="form-control" placeholder="Seu nome" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="conteudo" class="form-label"><i class="bi bi-file-text me-2"></i>Conteúdo</label>
                            <textarea name="conteudo" class="form-control" placeholder="Escreva o conteúdo da postagem aqui..." rows="8" required></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label for="imagemUrl" class="form-label"><i class="bi bi-card-image me-2"></i>URL da Imagem (Opcional)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-link-45deg"></i></span>
                                <input type="url" name="imagemUrl" class="form-control border-start-0" placeholder="https://...">
                            </div>
                            <div class="form-text mt-2"><i class="bi bi-info-circle me-1"></i> A imagem aparecerá no card da postagem.</div>
                        </div>

                        <div class="d-grid gap-2 mt-5">
                            <button type="submit" class="btn btn-tech btn-lg">
                                <i class="bi bi-send-fill me-2"></i>Publicar
                            </button>
                        </div>
                        
                        <div id="statusMessage" class="mt-3 text-center fw-bold"></div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const form = document.getElementById("createForm");
        const statusMsg = document.getElementById('statusMessage');
        const btn = form.querySelector('button[type="submit"]');

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Publicando...';

            try {
                const formData = Object.fromEntries(new FormData(e.target));
                
                const res = await fetch("/api/posts", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Erro ao publicar.');
                }

                statusMsg.className = "mt-3 text-center text-success";
                statusMsg.innerHTML = '<i class="bi bi-check-lg"></i> Postagem criada com sucesso!';
                
                form.reset(); 

                setTimeout(() => {
                    statusMsg.textContent = "";
                }, 3000);

            } catch (err) {
                console.error(err);
                statusMsg.className = "mt-3 text-center text-danger";
                statusMsg.innerHTML = `<i class="bi bi-exclamation-triangle"></i> ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
